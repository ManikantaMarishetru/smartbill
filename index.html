<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Viewport for Android phones: responsive, no zoom issues -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0C7A3D" />
  <title>SmartBill</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="shell">
    <!-- App navigation shell. app.js only uses button[data-view] + .active,
         so this aside restyle is purely presentational. -->
    <aside id="side" class="no-print">
      <div class="brand-block">
        <div class="brand">Smart<em>Bill</em></div>
        <div class="brand-sub">Billing &amp; khata for your shop</div>
      </div>
      <nav id="main-nav" class="no-print" aria-label="Main">
        <button data-view="dashboard" class="active">Dashboard</button>
        <button data-view="newbill">New Bill</button>
        <button data-view="invoices">Invoices</button>
        <button data-view="customers">Customers</button>
        <button data-view="ledger">Credit Ledger</button>
        <button data-view="settings">Settings</button>
      </nav>
      <div class="side-foot"><small>Data stays on this device, not on any cloud.</small></div>
    </aside>

    <div id="content">
      <!-- Main content. Each section is EMPTY; js/app.js renders into the inner divs. -->
      <main>
        <section id="view-dashboard" class="active"><div id="dashboard-app"></div></section>
        <section id="view-newbill"><div id="bill-app"></div></section>
        <section id="view-invoices"><div id="invoices-app"></div></section>
        <section id="view-invoice-detail"><div id="invoice-detail-app"></div></section>
        <section id="view-customers"><div id="customers-app"></div></section>
        <section id="view-customer-detail"><div id="customer-detail-app"></div></section>
        <section id="view-ledger"><div id="ledger-app"></div></section>
        <section id="view-settings"><div id="settings-app"></div></section>
      </main>

      <footer class="no-print">
        <small>Your data stays on this device (saved in localStorage, not on any cloud).</small>
      </footer>
    </div>
  </div>

  <!-- Toast for success/error messages (app.js fills text + .show/.ok/.err) -->
  <div id="toast" role="status" aria-live="polite"></div>

  <!-- Print-only area: receipts/statements rendered here for window.print() -->
  <div id="print-area"></div>

  <!-- App entry point: renders all view content dynamically. Zero npm/CDN deps. -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
